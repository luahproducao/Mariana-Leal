<style>
/* Layout: uma coluna de celular, barra de navegação fixa embaixo, dias no topo só em Hoje e Gravar. */
:root{
  --bg:#FAF6F8; --surface:#FFFFFF; --ink:#241A26; --muted:#6B5E6E; --line:#E8DEE9;
  --accent:#C8281C; --accent-soft:#FBE4E1; --accent-ink:#FFFFFF;
  --ok:#2A7A58; --ok-soft:#DDF0E6; --warn:#955700; --warn-soft:#FBEBCB; --info:#2D5C99; --info-soft:#E0EAF7; --bad:#B3261E; --bad-soft:#FADDDA;
  --hero:#17111B; --hero-ink:#FFFFFF; --hero-muted:#D9C6DD;
  --display:'Montserrat','Segoe UI',system-ui,sans-serif;
  --body:'DM Sans','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#150F17; --surface:#201824; --ink:#F4ECF5; --muted:#B5A7B9; --line:#382D3B;
  --accent:#FF7062; --accent-soft:#40201E; --accent-ink:#1A0E15;
  --ok:#6FD0A2; --ok-soft:#1D3A2E; --warn:#F2BC63; --warn-soft:#3B2D12; --info:#8DB8F2; --info-soft:#1D2D45; --bad:#FF8C84; --bad-soft:#44201E;
  --hero:#241A28; --hero-ink:#FFFFFF; --hero-muted:#CDB8D2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#150F17; --surface:#201824; --ink:#F4ECF5; --muted:#B5A7B9; --line:#382D3B;
  --accent:#FF7062; --accent-soft:#40201E; --accent-ink:#1A0E15;
  --ok:#6FD0A2; --ok-soft:#1D3A2E; --warn:#F2BC63; --warn-soft:#3B2D12; --info:#8DB8F2; --info-soft:#1D2D45; --bad:#FF8C84; --bad-soft:#44201E;
  --hero:#241A28; --hero-ink:#FFFFFF; --hero-muted:#CDB8D2; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-block:16px 104px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h2{font-size:26px}
h3{font-size:18px}
.kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:700;font-size:20px}
.sync{font-size:12px;color:var(--muted);text-align:right}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.day{flex:0 0 auto;min-width:64px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:8px 10px;text-align:center;cursor:pointer;font:inherit}
.day .w{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.day .n{font-family:var(--display);font-size:20px;font-weight:700;line-height:1.1}
.day .p{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day[aria-pressed="true"] .w,.day[aria-pressed="true"] .p{color:var(--accent-ink);opacity:.85}
.day.full .p{color:var(--ok);font-weight:700}
.day[aria-pressed="true"].full .p{color:var(--accent-ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.bottom .in{display:flex;width:100%;max-width:680px;gap:2px}
.nb{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;cursor:pointer}
.nb svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nb[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:14px}
.sub{color:var(--muted);margin:0}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:18px;display:flex;gap:16px;align-items:center;justify-content:space-between}
.hero .kicker{color:var(--hero-muted)}
.hero h2{color:var(--hero-ink)}
.hero p{margin:4px 0 0;color:var(--hero-muted);font-size:15px}
.hero .txt{min-width:0;display:flex;flex-direction:column;gap:2px}
.ring{flex:0 0 auto;position:relative;width:84px;height:84px}
.ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.ring .bg{stroke:rgba(255,255,255,.2)}
.ring .fg{stroke:#8FE3B5;transition:stroke-dashoffset .3s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:20px;color:#fff;font-variant-numeric:tabular-nums}
.need{background:var(--warn-soft);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.need>b{color:var(--warn);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.alert{background:var(--accent-soft);border-radius:14px;padding:12px 14px}
.alert b{color:var(--accent);font-size:12px;letter-spacing:.06em;text-transform:uppercase;display:block}
.block{display:flex;flex-direction:column;gap:8px}
.block>h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--body);font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.item.done{background:var(--ok-soft);border-color:transparent}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 14px}
.row input[type=checkbox]{flex:0 0 auto;width:24px;height:24px;margin:1px 0 0;accent-color:var(--ok);cursor:pointer}
.row label,.row .txt{flex:1;min-width:0;font-weight:500}
.row label{cursor:pointer}
.chkd label{text-decoration:line-through;color:var(--muted)}
.need .row{padding:4px 0}
.s-num{flex:0 0 auto;font-family:var(--display);font-weight:700;color:var(--muted);min-width:22px;font-variant-numeric:tabular-nums}
.meta{display:flex;gap:8px;align-items:center;padding:0 14px 12px;flex-wrap:wrap}
select{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:6px 8px}
select.st-rec,select.st-sent{background:var(--info-soft);border-color:transparent;color:var(--info)}
select.st-edit{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
select.st-posted,select.st-venda{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
details{border-top:1px solid var(--line)}
summary{padding:10px 14px;cursor:pointer;color:var(--accent);font-size:14px;font-weight:700}
details .in{padding:0 14px 12px;display:flex;flex-direction:column;gap:8px}
details .in p{margin:0;white-space:pre-line}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-right:6px;vertical-align:1px}
.tag.l{background:var(--ok-soft);color:var(--ok)}
.tag.m{background:var(--info-soft);color:var(--info)}
.tag.t{background:var(--warn-soft);color:var(--warn)}
textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;padding:10px 12px}
textarea{min-height:84px;resize:vertical}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:10px 16px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.small{padding:7px 12px;font-size:14px}
.btn.big{padding:16px 20px;font-size:18px;width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.card p{margin:0}
.card.click{cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.card.click:hover{border-color:var(--accent)}
.date{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent)}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.count.hot{color:var(--warn);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.scroll{overflow-x:auto}
.link{color:var(--accent);font-weight:700}
.note{font-size:13px;color:var(--muted)}
.draft{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:500}
.rest{background:var(--info-soft);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.rec{background:var(--surface);border:2px solid var(--accent);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
.rec .big-text{font-family:var(--display);font-size:24px;line-height:1.3}
.tip{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:15px}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields label,.lab{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
@media (max-width:440px){.fields{grid-template-columns:1fr}.hero{padding:14px}}
.out{background:var(--ok-soft);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.out .big{font-family:var(--display);font-size:34px;font-weight:700;color:var(--ok);font-variant-numeric:tabular-nums}
.out.bad{background:var(--bad-soft)}.out.bad .big{color:var(--bad)}
.ebook{display:flex;flex-direction:column;gap:12px}
.ebook .page{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:10px}
.ebook .page p{margin:0;white-space:pre-line}
.ebook .page h3{font-size:22px}
.cols3{display:grid;gap:12px;grid-template-columns:1fr}
.good{color:var(--ok);font-weight:700}.badc{color:var(--bad);font-weight:700}
@media (prefers-reduced-motion:reduce){.ring .fg{transition:none}}

/* ---- visual v3: marfim, vinho e dourado, delicado e elegante ---- */
:root{--bg:#FAF6F1;--surface:#FFFEFC;--ink:#2B2024;--muted:#6F6065;--line:#EBE0D6;--accent:#7B1E2E;--accent-soft:#F5E8E9;--accent-ink:#FFFFFF;--gold:#B08D57;--gold-ink:#8A6A3A;--gold-soft:#F3EBDD;--hero:#2B1620;--display:'Cormorant Garamond','Playfair Display',Georgia,serif;--shadow:0 1px 0 rgba(176,141,87,.10),0 24px 40px -30px rgba(80,40,50,.28);--glass:rgba(255,254,252,.9);--r:18px}

body{padding-block:18px 130px;font-size:15.5px;font-weight:400;line-height:1.55}

function isoToday(){var n=new Date();return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0")}
function pickDay(){var t=isoToday();for(var i=0;i<DAYS.length;i++){if(DAYS[i].date>=t)return DAYS[i].id}return DAYS[DAYS.length-1].id}
function dayById(id){return DAYS.filter(function(d){return d.id===id})[0]}
function daysUntil(iso){var a=new Date(isoToday()+"T00:00:00"),b=new Date(iso+"T00:00:00");return Math.round((b-a)/86400000)}
function trackItems(d){
  var out=[{id:d.id+"-f",label:"Feed: "+d.feed.title}];
  d.stories.forEach(function(s,i){out.push({id:d.id+"-s"+(i+1),label:"Story "+(i+1),core:s[2].indexOf("c")>=0,aud:s[0],tray:s[2].indexOf("t")>=0,text:s[1],n:i+1})});

}

function copyText(text,btn){
  var done=function(m){if(btn)btn.textContent=m};
  var fallback=function(){var ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand("copy")}catch(_){}document.body.removeChild(ta);done(ok?"Copiado":"Não consegui copiar")};

function bodyCalc(){
  function f(key,label,def,hint){return '<label>'+label+'<input type="text" inputmode="decimal" data-tool="calc.'+key+'" value="'+esc(T("calc."+key,def))+'">'+(hint?'<span class="note">'+hint+'</span>':'')+'</label>'}
  return '<div class="card"><h3>Seus números</h3><div class="fields">'
   +f("custo","Custo da peça (R$)","40")+f("frete","Frete da compra (R$)","5")+f("tax","Taxas sobre a venda (%)","6","Cartão, plataforma, etc.")+f("mar","Margem que você quer (%)","30","Parte do preço que sobra")+f("atual","Preço atual (R$)","90","Opcional")
   +'</div><p class="note">Os valores iniciais são um exemplo fictício. Troque pelos seus.</p></div><div id="calc-out"></div>';
}
function updateCalc(){
  var o=$("#calc-out");if(!o)return;
  var custo=parseNum(T("calc.custo","40")),frete=parseNum(T("calc.frete","5")),tax=parseNum(T("calc.tax","6")),mar=parseNum(T("calc.mar","30")),atual=parseNum(T("calc.atual","90"));
  var den=1-tax/100-mar/100;
  if(den<=0.05){o.innerHTML='<div class="out bad"><b>Essa conta não fecha</b><p>Taxas mais margem passam de 95% do preço. Reduza a margem ou veja se as taxas estão certas.</p></div>';return}
  var minimo=(custo+frete)/den,lucro=minimo*mar/100;
  var h='<div class="out"><span class="note">Preço mínimo</span><span class="big">'+brl(minimo)+'</span><span>Sobram '+brl(lucro)+' por peça, com margem de '+pct(mar)+'.</span></div>';
  if(atual>0){
    if(atual<minimo)h+='<div class="out bad"><b>O preço atual está abaixo do mínimo</b><p>Com '+brl(atual)+' você não atinge a margem desejada. Sem desconto, já falta '+brl(minimo-atual)+'.</p></div>';
    else h+='<div class="out"><span class="note">Desconto máximo sobre '+brl(atual)+'</span><span class="big">'+pct((1-minimo/atual)*100)+'</span></div>';
    h+='<div class="card"><h3>Simulação de desconto</h3><div class="scroll"><table><thead><tr><th>Desconto</th><th>Preço</th><th>Margem</th><th></th></tr></thead><tbody>';
    [10,20,30,40].forEach(function(d){
      var pr=atual*(1-d/100),m=((pr*(1-tax/100))-custo-frete)/pr*100;
      var ok=m>=mar,neg=m<0;
      h+='<tr><td>'+d+'%</td><td>'+brl(pr)+'</td><td>'+pct(m)+'</td><td class="'+(ok?'good':'badc')+'">'+(ok?'Dentro':(neg?'Prejuízo':'Abaixo'))+'</td></tr>';
    });
    h+='</tbody></table></div></div>';
  }
  h+='<p class="note">Fórmula: (custo + frete) ÷ (1 − taxas − margem). Margem calculada sobre o preço de venda.</p>';
  o.innerHTML=h;
}

var SRC=window.SpeechRecognition||window.webkitSpeechRecognition;
function plMic(){
  if(PL.rec){try{PL.rec.stop()}catch(e){}return}
  try{var r=new SRC();r.lang="pt-BR";r.interimResults=false;r.continuous=false;
    r.onresult=function(ev){var t=Array.prototype.map.call(ev.results,function(x){return x[0].transcript}).join(" ");PL.txt=(PL.txt?PL.txt+" ":"")+t;render()};
    r.onend=function(){PL.rec=null;render()};
    r.onerror=function(){PL.msg="Não consegui usar o microfone. Digite o texto.";PL.rec=null;render()};
    r.start();PL.rec=r;render()}catch(e){PL.msg="O microfone não está disponível aqui. Digite o texto.";render()}
}

var S=null,D=null;
var NOAI="A IA ainda não está ligada neste aparelho. Peça à assessoria o link de configuração (ele liga a IA e a sincronização) ou abra o app pelo Claude. O resto do app funciona normalmente.";
var TIPOS=[["ebook","eBook"],["checklist","Checklist"],["ficha","Ficha"],["exercicio","Exercício"],["guia","Guia de edição"],["midia","Documento para marcas"],["relatorio","Relatório"],["roteiro","Roteiro de publi"]];
var RULES="Contexto: Mariana Leal (@mariana.leaal) é influenciadora e dona de uma loja de roupas. O público dela é formado por lojistas iniciantes, muitas sem CNPJ, com pouco conhecimento de gestão. Escreva em português do Brasil, com linguagem simples, direta e humana, sem jargão e sem travessões. REGRAS: não invente fatos, histórias, números, resultados, preços ou depoimentos da Mariana. Use apenas o que ela escreveu e respondeu. Quando faltar informação, escreva [PREENCHER: o que falta]. Exemplos com números só se estiverem claramente marcados como fictícios. Nunca prometa resultado de vendas.";
function crNew(tp){return {step:0,tipo:tp||"ebook",ideia:"",publico:"",perguntas:[],respostas:[],outline:null,material:null,busy:"",err:""}}
function saveCr(){try{localStorage.setItem("hoje-cr",JSON.stringify(state.cr))}catch(e){}}
function tipoLabel(t){return (TIPOS.filter(function(x){return x[0]===t})[0]||[,"Material"])[1]}
function normMat(r,old){return {titulo:String(r.titulo||old.titulo),subtitulo:String(r.subtitulo||""),intro:String(r.intro||""),fechamento:String(r.fechamento||""),secoes:(r.secoes||old.secoes).map(function(x){return {titulo:String(x.titulo||""),corpo:String(x.corpo||""),itens:(x.itens||[]).map(String)}})}}
function crErr(e){
  var c=e&&e.code;
  if(c==="not_granted")return "Para criar com o Claude, permita o uso quando o aviso aparecer.";
  if(c==="rate_limited")return "Muitas tentativas seguidas. Espere um pouco e tente de novo.";
  if(c==="cancelled")return "";
  if(c==="no_key")return NOAI;
  if(c==="bad_key")return "A chave da API não foi aceita. Confira em Ajustes → Inteligência artificial.";
  if(c==="net")return "Sem conexão com a internet. Seus textos continuam salvos.";
  if(c==="parse")return "A resposta veio incompleta. Tente de novo.";
  if(c==="api")return "O serviço de IA recusou o pedido (código "+(e.status||"?")+"). Confira a chave e o saldo da conta.";
  return "Não consegui gerar agora. Seus textos continuam salvos. Tente de novo em instantes.";
}
async function crRun(label,fn){
  state.cr.busy=label;state.cr.err="";saveCr();render();
  try{await fn()}catch(e){state.cr.err=crErr(e)}
  state.cr.busy="";saveCr();render();
}
function qa(){var c=state.cr;return c.perguntas.map(function(q,i){return "P: "+q+"\nR: "+(c.respostas[i]||"(sem resposta)")}).join("\n\n")}
function crAction(a,el){
  var c=state.cr;
  if(!S&&(a==="ask"||a==="outline"||a==="write"||a==="sug"||a==="gerarguia"||a.indexOf("voz")===0||a.indexOf("apl")===0)){c.err=NOAI;render();return}
  if(a==="gerarguia"){gerarGuia();return}
  if(a==="savemodel"){cfg().doc=clone(c.material);cfgSave();el.textContent="Modelo salvo";return}
  if(a==="gclear"){gImgs=[];render();return}
  if(a==="sugclear"){c.sug=[];render();return}
  if(a==="sug"){
    var nb=c.material.secoes.length;
    crRun("Analisando o material...",async function(){
      var r=await S.json(RULES+"\n\nAnalise este material ("+tipoLabel(c.tipo)+") e liste até 5 melhorias específicas e acionáveis: clareza, ordem, o que falta, lacunas [PREENCHER], chamada final. Para cada uma informe \"bloco\" (número do bloco de 1 a "+nb+", ou 0 se for geral), \"titulo\" e \"como\" (instrução curta de reescrita). Responda SOMENTE com JSON {\"sugestoes\":[{\"bloco\":0,\"titulo\":\"\",\"como\":\"\"}]}.\n\n"+JSON.stringify(c.material),{modelTier:"quick"});
      c.sug=(r.sugestoes||[]).slice(0,5).map(function(x){var b=parseInt(x.bloco,10);return {bloco:(b>=1&&b<=nb)?b:0,titulo:String(x.titulo||""),como:String(x.como||"")}});
    });return;
  }
  if(a.indexOf("apl")===0){
    var si=parseInt(a.slice(3),10),sg=(c.sug||[])[si];if(!sg||!(sg.bloco>0))return;
    var ix=sg.bloco-1,sec0=c.material.secoes[ix];
    crRun("Aplicando a sugestão...",async function(){
      var r3=await S.json(RULES+"\n\n"+vozGuia(sg.como)+"\n\nAplique a melhoria pedida. Mantenha os fatos e os trechos [PREENCHER]. Bloco atual:\n"+JSON.stringify(sec0)+"\n\nResponda SOMENTE com JSON {\"titulo\":\"\",\"corpo\":\"\",\"itens\":[\"\"]}.",{modelTier:"default"});
      c.undo={kind:"sec",i:ix,data:JSON.parse(JSON.stringify(sec0))};
      c.material.secoes[ix]={titulo:String(r3.titulo||sec0.titulo),corpo:String(r3.corpo||""),itens:(r3.itens||[]).map(String)};
      c.sug.splice(si,1);
    });return;
  }
  if(a==="ask"){
    if(!c.ideia.trim()){c.err="Escreva a ideia primeiro, do jeito que você falaria.";render();return}
    crRun("Pensando nas perguntas...",async function(){
      var r=await S.json(RULES+"\n\nTipo de material: "+tipoLabel(c.tipo)+"\nIdeia da Mari: "+c.ideia+"\nPara quem: "+(c.publico||"(não informado)")+"\n\nFaça 4 perguntas curtas e específicas que ajudem a amadurecer essa ideia: para quem é, qual problema resolve, qual resultado a pessoa terá e que exemplo real a Mari pode contar. Responda SOMENTE com JSON no formato {\"perguntas\":[\"...\",\"...\",\"...\",\"...\"]}.",{modelTier:"quick"});
      c.perguntas=(r&&r.perguntas||[]).slice(0,5).map(String);c.respostas=c.perguntas.map(function(){return ""});c.step=1;
    });return;
  }
  if(a==="outline"){
    crRun("Montando o esqueleto...",async function(){
      var forma={ebook:"um eBook curto com 5 a 8 seções; em itens, liste os tópicos de cada seção",checklist:"um checklist com 4 a 6 grupos; em itens, liste de 3 a 6 tarefas curtas no imperativo por grupo",ficha:"uma ficha para preencher; em itens, liste os campos de cada grupo",exercicio:"um exercício prático; em itens, liste os passos de cada etapa"}[c.tipo];
      var r=await S.json(RULES+"\n\nTipo: "+forma+".\nIdeia da Mari: "+c.ideia+"\nPara quem: "+(c.publico||"(não informado)")+"\n\nPerguntas e respostas:\n"+qa()+"\n\nCrie o esqueleto. Responda SOMENTE com JSON no formato {\"titulo\":\"\",\"subtitulo\":\"\",\"secoes\":[{\"titulo\":\"\",\"itens\":[\"\"]}]}.",{modelTier:"default"});
      c.outline={titulo:String(r.titulo||""),subtitulo:String(r.subtitulo||""),secoes:(r.secoes||[]).map(function(s){return {titulo:String(s.titulo||""),itens:(s.itens||[]).map(String)}})};c.step=2;
    });return;
  }
  if(a==="write"){
    crRun("Escrevendo o material...",async function(){
      var o=c.outline;
      var forma={ebook:"Para cada seção escreva \"corpo\" com 60 a 120 palavras, simples e prático. Pode deixar \"itens\" vazio ou usar como lista de apoio.",checklist:"Mantenha \"itens\" claros, curtos e no imperativo. \"corpo\" é no máximo uma frase de apoio.",ficha:"\"itens\" são os campos a preencher. \"corpo\" é uma frase de instrução.",exercicio:"\"itens\" são os passos. \"corpo\" explica o objetivo da etapa em 1 ou 2 frases."}[c.tipo];
      var r=await S.json(RULES+"\n\nTipo: "+tipoLabel(c.tipo)+".\nIdeia da Mari: "+c.ideia+"\nPara quem: "+(c.publico||"(não informado)")+"\n\nPerguntas e respostas:\n"+qa()+"\n\nEsqueleto aprovado:\n"+JSON.stringify(o)+"\n\n"+forma+" Escreva também \"intro\" (2 a 3 frases) e \"fechamento\" (1 a 2 frases). Responda SOMENTE com JSON no formato {\"titulo\":\"\",\"subtitulo\":\"\",\"intro\":\"\",\"secoes\":[{\"titulo\":\"\",\"corpo\":\"\",\"itens\":[\"\"]}],\"fechamento\":\"\"}.",{modelTier:"default"});
      c.material={titulo:String(r.titulo||o.titulo),subtitulo:String(r.subtitulo||o.subtitulo),intro:String(r.intro||""),fechamento:String(r.fechamento||""),secoes:(r.secoes||[]).map(function(s){return {titulo:String(s.titulo||""),corpo:String(s.corpo||""),itens:(s.itens||[]).map(String)}})};c.step=3;c.view="edit";c.undo=null;
    });return;
  }
  if(a==="ver"){c.view="ver";saveCr();render();return}
  if(a==="editar"){c.view="edit";saveCr();render();return}
  if(a==="maddsec"){c.material.secoes.push({titulo:"",corpo:"",itens:[]});saveCr();render();return}
  if(a.indexOf("mdel")===0){c.material.secoes.splice(parseInt(a.slice(4),10),1);saveCr();render();return}
  if(a==="undo"&&c.undo){if(c.undo.kind==="all")c.material=c.undo.data;else c.material.secoes[c.undo.i]=c.undo.data;c.undo=null;saveCr();render();return}
  if(a.indexOf("voz")===0){
    var voz=(state.voz||"").trim(),ins=(c.instr||"").trim();
    if(!voz&&!ins){c.err="Cole um texto seu em “Meu jeito de falar” ou escreva um ajuste, como “mais direto”.";render();return}
    var all=a==="voz-all",idx=all?-1:parseInt(a.slice(3),10);
    var guia="Jeito da Mari de escrever e falar (exemplos reais dela):\n"+(voz||"(não informado)")+"\nAjuste pedido: "+(ins||"(nenhum)")+"\n\nReescreva no jeito dela: mesma linguagem, ritmo e expressões dos exemplos. Mantenha todos os fatos e o sentido, não acrescente informação nova, mantenha os trechos [PREENCHER] e a mesma estrutura de campos. Não copie frases inteiras dos exemplos.";
    crRun(all?"Reescrevendo tudo no seu jeito...":"Reescrevendo o bloco...",async function(){
      if(all){
        var r=await S.json(RULES+"\n\n"+guia+"\n\nMaterial atual:\n"+JSON.stringify(c.material)+"\n\nResponda SOMENTE com JSON no mesmo formato {\"titulo\":\"\",\"subtitulo\":\"\",\"intro\":\"\",\"secoes\":[{\"titulo\":\"\",\"corpo\":\"\",\"itens\":[\"\"]}],\"fechamento\":\"\"}.",{modelTier:"default"});
        c.undo={kind:"all",data:JSON.parse(JSON.stringify(c.material))};
        c.material=normMat(r,c.material);
      }else{
        var sec=c.material.secoes[idx];
        var r2=await S.json(RULES+"\n\n"+guia+"\n\nBloco atual:\n"+JSON.stringify(sec)+"\n\nResponda SOMENTE com JSON no formato {\"titulo\":\"\",\"corpo\":\"\",\"itens\":[\"\"]}.",{modelTier:"default"});
        c.undo={kind:"sec",i:idx,data:JSON.parse(JSON.stringify(sec))};
        c.material.secoes[idx]={titulo:String(r2.titulo||sec.titulo),corpo:String(r2.corpo||""),itens:(r2.itens||[]).map(String)};
      }
    });return;
  }
  if(a==="back"&&isDirect(c.tipo)&&c.tipo!=="guia"){if(state.tab==="pub")state.pub=state.pubBack||"parc";else state.cr=crNew();saveCr();render();return}
  if(a==="back"){c.step=c.tipo==="guia"?0:Math.max(0,c.step-1);c.err="";saveCr();render();return}
  if(a==="reset"&&isDirect(c.tipo)&&c.tipo!=="guia"){if(state.tab==="pub")state.pub=state.pubBack||"parc";state.cr=crNew();saveCr();render();return}
  if(a==="reset"){state.cr=crNew(c.tipo==="guia"?"guia":undefined);saveCr();render();return}
  if(a==="addsec"){c.outline.secoes.push({titulo:"",itens:[]});saveCr();render();return}
  if(a.indexOf("delsec")===0){c.outline.secoes.splice(parseInt(a.slice(6),10),1);saveCr();render();return}
  if(a==="copy"){copyText(materialText(c.material),el);return}
  if(a==="pdf"){
    if(!D){el.textContent="Salvar não está disponível aqui";return}
    var doc=null;try{doc=makePdf(c.material,c.tipo)}catch(e){doc=null}
    if(!doc){el.textContent="PDF indisponível agora";return}
    D.save({filename:crName(c.material)+".pdf",data:doc.output("arraybuffer")}).then(function(){el.textContent="PDF salvo"},function(e){el.textContent=(e&&e.code==="declined")?"Salvar cancelado":"Não consegui salvar o PDF"});
    return;
  }

  v.onloadedmetadata=function(){var d=v.duration||1;for(var i=0;i<n;i++)times.push(d*(i+0.5)/n);next()};
  v.onseeked=function(){var sc=Math.min(1,640/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement("canvas");c.width=Math.round(v.videoWidth*sc);c.height=Math.round(v.videoHeight*sc);c.getContext("2d").drawImage(v,0,0,c.width,c.height);c.toBlob(function(b){if(b)out.push(b);k++;next()},"image/jpeg",0.7)};

function fitVerdict(){
  var f=state.fit,C2=cfg(),ks=C2.fit.map(function(c){return c[0]}).filter(function(k){return k!=="val"}),sv=function(k){return f.s[k]||3};
  var avg=ks.length?ks.reduce(function(a,k){return a+sv(k)},0)/ks.length:3;
  var words=String(C2.lim.recusa||"").toLowerCase().split(",").map(function(x){return x.trim()}).filter(Boolean),cat=(f.cat||"").toLowerCase();
  var bad=words.some(function(w){return cat.indexOf(w)>=0});
  var v,cls;
  if(bad){v="Recusar: categoria que a Mari não faz.";cls="bad"}
  else if(!f.agora&&!f.depois){v="Recusar ou rever: não gera dinheiro agora nem valor para a marca depois.";cls="bad"}
  else if(avg>=4){v=(f.s.val||3)<=2?"Fit alto, mas o valor está baixo. Aceite só com valor melhor.":"Aceitar.";cls="ok"}
  else if(avg>=3){v="Negociar: ajuste o ângulo, o formato ou o valor antes de aceitar.";cls="t"}
  else{v="Recusar, mesmo que o valor seja alto. Orçamento não substitui fit.";cls="bad"}
  return {avg:avg,v:v,cls:cls,conf:(f.s.conf||5)<=2};
}

function trayDirText(id){

  t.push("TAKES SUGERIDOS");d.takes.forEach(function(x){t.push("- "+x)});

function pubClick(el){
  var tg=el.closest("[data-tg]");if(tg){state[tg.dataset.tg]=!state[tg.dataset.tg];render();return true}
  var p=el.closest("[data-pub]");if(p){state.pub=p.dataset.pub;render();window.scrollTo(0,0);return true}
  var co=el.closest("[data-campopen]");if(co){state.campOpen=state.campOpen===co.dataset.campopen?null:co.dataset.campopen;render();return true}
  var tx=el.closest("[data-trx]");
  if(tx){var tq=tx.dataset.trx.split("|"),tid=tq[1];
    if(tq[0]==="open"){state.trayOpen=state.trayOpen===tid?null:tid;render();return true}
    if(tq[0]==="cpf"){copyText(TRAYDIR[tid].roteiro[+tq[2]][1],tx);return true}
    if(tq[0]==="cpl"){copyText(TRAYDIR[tid].leg,tx);return true}
    if(tq[0]==="tk"){state.trayTk=state.trayTk||{};var kk=tid+tq[2];state.trayTk[kk]=!state.trayTk[kk];render();return true}
    if(tq[0]==="copy"){copyText(trayDirText(tid),tx);return true}
    if(tq[0]==="pdf"){pubOpenMat("relatorio",trayMat(tid,trayMissaoNome(tid)));return true}
    if(tq[0]==="dia"){var nm=trayMissaoNome(tid);MD.items.push(mdNew({t:"Tray: "+nm,tipo:"gravar",parc:"Tray",d:isoToday()}));mdLocal();tx.textContent="Adicionado ao Meu dia";return true}
  }
  var cx=el.closest("[data-campx]");
  if(cx){var a=cx.dataset.campx;
    if(a==="add"){var t=$("#cp-t").value.trim()||"Campanha",d=$("#cp-d").value;if(!d)return true;state.campOpen=campAdd($("#cp-m").value,t,d);render();return true}
    if(a==="seed"){state.campOpen=campAdd("Bling","Carrossel Black Friday","2026-11-09","2026-11-05");render();return true}
    if(a==="doc"){pubOpenMat("midia",docMarcas());return true}
    if(a.indexOf("rel|")===0){pubOpenMat("relatorio",relMat(a.slice(4)));return true}
    if(a.indexOf("roteiro|")===0){var c=state.camp[a.slice(8)];state.pr.marca=marcaList().indexOf(c.m)>=0?c.m:"Outra marca";state.pr.parcId=null;savePr();state.pub="roteiro";render();window.scrollTo(0,0);return true}
    if(a.indexOf("del|")===0){var id=a.slice(4);delete state.camp[id];savePub();dbSet("camp",id,{del:true,at:Date.now()},"Removida");state.campOpen=null;render();return true}
  }
  var cf=el.closest("[data-cfx]");
  if(cf){var q=cf.dataset.cfx.split("|"),a2=q[0],C2=cfg();
    if(a2==="etapa-add")C2.etapas.push({id:"x"+Date.now(),label:"Nova etapa",quem:"Mari",ref:"post",off:0});
    else if(a2==="etapa-del"){var ix=parseInt(q[1],10),rid=C2.etapas[ix]&&C2.etapas[ix].id;if(["e7","e9","e10"].indexOf(rid)<0){C2.etapas.splice(ix,1);Object.keys(state.camp).forEach(function(id){var cc=state.camp[id];if(cc.done&&cc.done[rid]){delete cc.done[rid];campSave(id)}})}}
    else if(a2==="etapa-reset")C2.etapas=clone(D_ETAPAS);
    else if(a2==="fit-add")C2.fit.splice(Math.max(0,C2.fit.length-1),0,["k"+Date.now(),"Novo critério"]);
    else if(a2==="fit-del")C2.fit.splice(parseInt(q[1],10),1);
    else if(a2==="marca-edit")state.edMarca=q[1]||null;
    else if(a2==="marca-del"){delete C2.marcas[q[1]];state.edMarca=null}
    else if(a2==="marca-add"){var nm=($("#nm-n").value||"").trim();if(!nm||C2.marcas[nm])return true;C2.marcas[nm]={ang:"",usar:[],evitar:[],visual:"",temas:[]};state.edMarca=nm}
    else if(a2==="doc-restore")C2.doc=null;
    else if(a2==="tray-addw")C2.tray.push({t:"Nova semana",m:[]});
    else if(a2==="tray-delw")C2.tray.splice(parseInt(q[1],10),1);
    else if(a2==="tray-addm")C2.tray[parseInt(q[1],10)].m.push(["m"+Date.now(),"Nova missão",0]);
    else if(a2==="tray-delm")C2.tray[parseInt(q[1],10)].m.splice(parseInt(q[2],10),1);
    else if(a2==="reset-all"){if(!state.confirmReset){state.confirmReset=true;render();return true}CF=cfgDef();state.confirmReset=false}
    cfgSave();render();return true}
  var pa=el.closest("[data-pra]");if(pa){pubRoteiroAction(pa.dataset.pra,pa);return true}
  var di=el.closest("[data-idel]");if(di){var iid=di.dataset.idel;state.ideas=state.ideas.filter(function(x){return x.id!==iid});dbSet("ideas",iid,{del:true,at:Date.now()},"Ideia apagada");render();return true}
  var pd=el.closest("[data-pldel]");if(pd){var pi=pd.dataset.pldel;delete state.plano[pi];savePlano();dbSet("plano",pi,{del:true,at:Date.now()},"Removido");render();return true}
  return false;
}
function pubChange(el){
  if(el.dataset.cdone){var q=el.dataset.cdone.split("|"),c=state.camp[q[0]];if(c){c.done=c.done||{};c.done[q[1]]=el.checked;campSave(q[0]);render()}return true}
  if(el.dataset.cf){var q2=el.dataset.cf.split("|"),c2=state.camp[q2[0]];if(!c2)return true;var k=q2[1];
    if(k.indexOf("rep.")===0){c2.rep=c2.rep||{};c2.rep[k.slice(4)]=el.value}else c2[k]=el.value;
    campSave(q2[0]);if(el.type==="date")render();return true}
  if(el.dataset.fit){state.fit.s[el.dataset.fit]=parseInt(el.value,10);render();return true}
  if(el.dataset.fitck){state.fit[el.dataset.fitck]=el.checked;render();return true}
  if(el.dataset.prck){state.pr.ck[el.dataset.prck]=el.checked;savePr();render();return true}
  if(el.dataset.pr==="pm"){state.pr.marca=el.value;savePr();return true}
  if(el.dataset.ed&&el.tagName==="SELECT"){setPath(cfg(),el.dataset.ed,el.value);cfgSave();render();return true}
  if(el.dataset.edname){var old=el.dataset.edname,nn=el.value.trim(),M=cfg().marcas;if(nn&&nn!==old&&!M[nn]&&M[old]){var o={};Object.keys(M).forEach(function(k2){o[k2===old?nn:k2]=M[k2]});cfg().marcas=o;state.edMarca=nn;Object.keys(state.camp).forEach(function(id){if(state.camp[id].m===old){state.camp[id].m=nn;campSave(id)}});cfgSave();render()}return true}
  if(el.dataset.plf){var pq=el.dataset.plf.split("|"),pp=state.plano[pq[0]];if(pp){pp[pq[1]]=el.value;savePlano();dbSet("plano",pq[0],pp,"Calendário salvo")}return true}
  if(el.dataset.ide){var it=state.ideas.filter(function(x){return x.id===el.dataset.ide})[0];if(it){it.text=el.value;dbSet("ideas",it.id,{text:it.text,at:it.at},"Ideia salva")}return true}
  return false;
}
function pubInput(el){
  if(el.dataset.ed&&el.tagName!=="SELECT"){var v=el.value;if(el.dataset.num)v=parseNum(v);if(el.dataset.lines)v=v.split("\n").map(function(x){return x.trim()}).filter(Boolean);setPath(cfg(),el.dataset.ed,v);cfgSaveSoon();return true}
  if(el.dataset.cfg){cfg()[el.dataset.cfg]=el.value;cfgSaveSoon();return true}
  if(el.dataset.fitcat){state.fit.cat=el.value;var fr=$("#fit-res");if(fr)fr.textContent="Resultado: "+fitVerdict().v;return true}

    savePr();return true}
  return false;
}

/* ============ PDF dentro do app (texto vetorial, via jsPDF) ============ */
function pdfSafe(s){return String(s==null?"":s).replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/…/g,"...").replace(/[–—]/g,"-").replace(/[•·]/g,"-").replace(/ /g," ").replace(/[^\n\x20-\x7e¡-ÿ]/g,"")}
function crName(m){return (m.titulo||"material").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"material"}
function pdfLabel(tipo,i,n){return tipo==="ebook"?"CAPÍTULO "+(i+1):(tipo==="guia"?"PASSO "+(i+1):(i+1)+" DE "+n)}
function makePdf(m,tipo){
  var J=window.jspdf;if(!J||!J.jsPDF)return null;
  var doc=new J.jsPDF({unit:"mm",format:"a4"}),W=210,H=297,M=18,CW=W-2*M,y=0,RED="#D22B1F";
  function rgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
  function fill(h){var c=rgb(h);doc.setFillColor(c[0],c[1],c[2])}
  function line(h){var c=rgb(h);doc.setDrawColor(c[0],c[1],c[2])}
  function ink(h){var c=rgb(h);doc.setTextColor(c[0],c[1],c[2])}
  function op(v){try{doc.setGState(new doc.GState({opacity:v}))}catch(e){}}
  /* capa */
  fill("#15101A");doc.rect(0,0,W,H,"F");
  if(CAPA){
    try{
      doc.addImage(CAPA,"JPEG",0,0,W,H);
      fill("#15101A");
      var N=60,y1=H*0.12,hh=(H-y1)/N;op(0.045);
      for(var i=0;i<N;i++){doc.rect(0,y1+i*hh,W,H-(y1+i*hh),"F")}
      op(1);
    }catch(e){op(1)}
  }
  doc.setFont("helvetica","bold");
  var tl,sl,tag=pdfSafe(tipoLabel(tipo)).toUpperCase();
  doc.setFontSize(30);tl=doc.splitTextToSize(pdfSafe(m.titulo).toUpperCase(),CW);
  doc.setFont("helvetica","normal");doc.setFontSize(13);sl=doc.splitTextToSize(pdfSafe(m.subtitulo),CW);
  var total=8+10+tl.length*12.5+(sl.length?sl.length*6+8:0)+10+14;
  y=Math.min(H-34-total,H*0.62);
  var pt="@MARIANA.LEAAL";doc.setFont("helvetica","bold");doc.setFontSize(9);
  var pw=doc.getTextWidth(pt)+10;line("#FFFFFF");doc.setLineWidth(0.4);doc.roundedRect(M,y,pw,8,4,4,"S");ink("#FFFFFF");doc.text(pt,M+5,y+5.3);
  y+=10+10;doc.setFontSize(30);doc.text(tl,M,y);y+=tl.length*12.5-2;
  if(sl.length){doc.setFont("helvetica","normal");doc.setFontSize(13);ink("#F0E4EA");doc.text(sl,M,y+4);y+=sl.length*6+8}
  y+=8;doc.setFont("helvetica","bold");doc.setFontSize(11);
  var tw=doc.getTextWidth(tag)+12;fill(RED);doc.rect(M,y,tw,10,"F");ink("#FFFFFF");doc.text(tag,M+6,y+6.7);
  fill(RED);doc.rect(0,H-14,W,14,"F");ink("#FFFFFF");doc.setFontSize(9);doc.text("ESTOQUE CRESCENTE",M,H-5.6);
  /* páginas de conteúdo */
  function newPage(){doc.addPage();fill("#FBF7F9");doc.rect(0,0,W,H,"F");fill(RED);doc.rect(0,0,W,4,"F");y=M+6}
  function need(h){if(y+h>H-M-8)newPage()}
  function para(text,size,font,col,lh){
    doc.setFont("helvetica",font);doc.setFontSize(size);ink(col);
    var ls=doc.splitTextToSize(pdfSafe(text),CW),step=size*0.3528*lh;
    ls.forEach(function(l){need(step);doc.text(l,M,y+size*0.3528);y+=step});
  }
  function box(text,bg,fg){
    doc.setFont("helvetica","normal");doc.setFontSize(11);
    var ls=doc.splitTextToSize(pdfSafe(text),CW-12),h=ls.length*5.6+10;need(h+4);
    fill(bg);doc.roundedRect(M,y,CW,h,3,3,"F");ink(fg);
    ls.forEach(function(l,i){doc.text(l,M+6,y+7+i*5.6)});y+=h+7;
  }
  newPage();
  if(m.intro)box(m.intro,"#FFF0B8","#2A2118");
  var secs=m.secoes||[];
  secs.forEach(function(s,i){
    need(36);
    var lab=pdfSafe(pdfLabel(tipo,i,secs.length));
    doc.setFont("helvetica","bold");doc.setFontSize(9);
    var lw=doc.getTextWidth(lab)+10;fill(RED);doc.rect(M,y,lw,7,"F");ink("#FFFFFF");doc.text(lab,M+5,y+4.9);y+=11;
    para((s.titulo||"").toUpperCase(),16,"bold","#1F1A20",1.2);
    fill("#FBCFE0");doc.rect(M,y+1,14,1.2,"F");y+=5;
    if(s.corpo){para(s.corpo,10.5,"normal","#1F1A20",1.5);y+=2}
    (s.itens||[]).forEach(function(t){
      doc.setFont("helvetica","normal");doc.setFontSize(10.5);
      var ls=doc.splitTextToSize(pdfSafe(t),CW-9),h=ls.length*5.4;need(h+2);
      if(tipo==="midia"||tipo==="relatorio"){fill(RED);doc.rect(M+0.6,y+1.6,1.8,1.8,"F")}else{line(RED);doc.setLineWidth(0.5);doc.rect(M,y+0.6,3.6,3.6,"S")}ink("#1F1A20");
      ls.forEach(function(l,k){doc.text(l,M+8,y+3.8+k*5.4)});y+=h+2.6;
    });
    y+=8;
  });
  if(m.fechamento)box(m.fechamento,"#FFF0B8","#2A2118");
  var n=doc.getNumberOfPages();
  for(var p=2;p<=n;p++){doc.setPage(p);doc.setFont("helvetica","normal");doc.setFontSize(8);ink("#8A7D86");doc.text("@mariana.leaal  ·  Estoque Crescente",M,H-10);fill(RED);doc.rect(W-M-9,H-15,9,7,"F");doc.setFont("helvetica","bold");ink("#FFFFFF");doc.text(String(p-1),W-M-4.5,H-10.2,{align:"center"})}
  return doc;
}

var AIMSG="";

function aiSet(o){try{localStorage.setItem("hoje-ai",JSON.stringify(o))}catch(e){}}
function blobB64(b){return new Promise(function(res,rej){var f=new FileReader();f.onload=function(){res(String(f.result).split(",")[1]||"")};f.onerror=function(){rej({code:"img"})};f.readAsDataURL(b)})}
function jsonFrom(t){t=String(t||"").replace(/```json|```/g,"");var a=t.indexOf("{"),b=t.lastIndexOf("}");if(a<0||b<a)throw {code:"parse"};try{return JSON.parse(t.slice(a,b+1))}catch(e){throw {code:"parse"}}}
function makeAI(){
  var cf0=aiGet();if(!(cf0.key||(cf0.proxy&&cf0.code)))return null;
  return {own:true,
    limits:async function(){return {images:{maxCount:6,mediaTypes:["image/jpeg","image/png","image/webp"]}}},
    json:async function(prompt,opt){
      opt=opt||{};var c2=aiGet(),viaP=!!(c2.proxy&&c2.code);if(!viaP&&!c2.key)throw {code:"no_key"};
      var model=opt.modelTier==="quick"?(c2.quick||"claude-haiku-5-5"):(c2.model||"claude-sonnet-5-5");
      var content=[];
      if(opt.images){for(var i=0;i<opt.images.length;i++){content.push({type:"image",source:{type:"base64",media_type:opt.images[i].type||"image/jpeg",data:await blobB64(opt.images[i])}})}}
      content.push({type:"text",text:prompt});
      var r;
      try{r=await fetch(viaP?c2.proxy.replace(/\/+$/,"")+"/ai":"https://api.anthropic.com/v1/messages",{method:"POST",headers:viaP?{"content-type":"application/json","x-app-code":c2.code}:{"content-type":"application/json","x-api-key":c2.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:model,max_tokens:8000,messages:[{role:"user",content:content}]})})}catch(e){throw {code:"net"}}
      if(r.status===401||r.status===403)throw {code:"bad_key"};
      if(r.status===413)throw {code:"api",status:413};
      if(r.status===429)throw {code:"rate_limited"};
      if(!r.ok)throw {code:"api",status:r.status};
      var j=await r.json();
      var t=(j.content||[]).filter(function(x){return x.type==="text"}).map(function(x){return x.text}).join("");
      return jsonFrom(t);
    }};
}

function brSeed(){
  try{if(localStorage.getItem("hoje-brain-seeded"))return;localStorage.setItem("hoje-brain-seeded","1")}catch(e){return}
  if(BR.items.length)return;
  BRSEED.forEach(function(x,i){BR.items.push({id:"seed"+(i+1),cat:x[0],text:x[1],pin:false,seed:true,at:1761800000000+i})});
  brLocal();
}
function brSorted(a){return a.slice().sort(function(x,y){return (y.pin?1:0)-(x.pin?1:0)||(y.at||0)-(x.at||0)})}
function brainCtx(){
  var a=BR.items.filter(function(x){return x.text&&x.text.trim()});if(!a.length)return "";
  var out="CÉREBRO DA MARI (o que ela mesma ensinou ao app. Trate como verdade sobre ela, respeite sempre e escreva no jeito dela. Se algo aqui contradisser o pedido, avise em vez de ignorar):\n",lim=7000,used=out.length;
  BRCATS.concat([["outro","Outros"]]).forEach(function(c){
    var l=brSorted(a.filter(function(x){return (x.cat||"outro")===c[0]}));if(!l.length)return;
    var blk="## "+c[1]+"\n";
    l.forEach(function(x){var ln="- "+x.text.trim().replace(/\n+/g," / ")+"\n";if(used+blk.length+ln.length<lim)blk+=ln});
    if(used+blk.length<lim){out+=blk;used+=blk.length}
  });
  return out;
}
function wrapBrain(s0){if(!s0||s0._br)return s0;return {own:s0.own,_br:1,limits:function(){return s0.limits.apply(s0,arguments)},json:function(p,o){var c=brainCtx();return s0.json(c?c+"\n\n"+p:p,o)}}}

     +'<div class="btns"><button class="btn" data-brb="saveprops">Guardar marcadas</button><button class="btn ghost small" data-brb="dropprops">Descartar</button></div></div>';
  }
  BRCATS.forEach(function(c){
    var l=brSorted(BR.items.filter(function(x){return x.cat===c[0]}));if(!l.length)return;
    h+='<div><h3>'+esc(c[1])+'</h3></div>'+l.map(function(x){return '<div class="card"><textarea data-bre="'+x.id+'" aria-label="Anotação">'+esc(x.text)+'</textarea><div class="meta" style="padding:0"><span class="note">'+(x.seed?'Revisar · ':'')+(x.pin?'Fixada · ':'')+new Date(x.at||Date.now()).toLocaleDateString("pt-BR")+'</span><span class="btns" style="gap:6px">'+(x.seed?'<button class="btn small" data-brb="ok" data-id="'+x.id+'">Confirmar</button>':'')+'<button class="btn ghost small" data-brb="pin" data-id="'+x.id+'">'+(x.pin?'Desafixar':'Fixar')+'</button><button class="btn ghost small" data-brb="del" data-id="'+x.id+'">Apagar</button></span></div></div>'}).join('');

}
document.addEventListener("click",async function(e){
  var t=e.target,pc=t.closest&&t.closest("[data-brcat]");
  if(pc){BRUI.cat=pc.dataset.brcat;BRUI.q=0;BRUI.msg="";render();return}
  var b=t.closest&&t.closest("[data-brb]");if(!b)return;
  var a=b.dataset.brb,id=b.dataset.id;
  if(a==="outra"){BRUI.q++;render();return}
  if(a==="add"){var ta=document.querySelector('[data-br="novo"]');var tx=ta?ta.value:BRUI.txt;if(!String(tx).trim()){BRUI.msg="Escreva algo antes de guardar.";render();return}brAdd(BRUI.cat,tx);BRUI.txt="";BRUI.msg="Guardado em “"+brLabel(BRUI.cat)+"”.";render();return}
  if(a==="pin"){var it=BR.items.filter(function(x){return x.id===id})[0];if(it){it.pin=!it.pin;brPut(it);render()}return}
  if(a==="del"){BR.items=BR.items.filter(function(x){return x.id!==id});brLocal();if(C.brain)C.brain.doc(id).set({del:true,at:Date.now()});render();return}
  if(a==="ok"){var i0=BR.items.filter(function(x){return x.id===id})[0];if(i0){delete i0.seed;brPut(i0);render()}return}
  if(a==="okall"){BR.items.forEach(function(x){if(x.seed){delete x.seed;brPut(x)}});render();return}
  if(a==="dropprops"){BRUI.props=[];render();return}
  if(a==="saveprops"){var n=0;BRUI.props.forEach(function(x){if(x.on&&brAdd(x.cat,x.texto))n++});BRUI.props=[];BRUI.msg=n+" guardada(s).";render();return}
  if(a==="digest"){
    var ta2=document.querySelector('[data-br="novo"]');var tx2=String(ta2?ta2.value:BRUI.txt).trim();BRUI.txt=tx2;
    if(!tx2){BRUI.msg="Cole um texto para o app separar.";render();return}
    if(!S){BRUI.msg=NOAI;render();return}
    BRUI.busy="Lendo seu texto...";BRUI.msg="";render();
    try{
      var r=await S.json("Leia o texto da Mari e extraia até 8 aprendizados duráveis sobre ela (jeito de falar, expressões, história, público, negócio, marcas, decisões, o que funcionou ou não). Use as palavras dela quando possível, uma ideia por item, sem inventar nem interpretar além do texto e sem repetir o que já está no cérebro. Categorias permitidas: voz, historia, publico, negocio, marcas, aprend, decisao.\n\nTexto:\n"+tx2+"\n\nResponda SOMENTE com JSON {\"itens\":[{\"cat\":\"\",\"texto\":\"\"}]}.",{modelTier:"default"});
      var ok=BRCATS.map(function(c){return c[0]});
      BRUI.props=(r.itens||[]).filter(function(x){return x&&x.texto&&ok.indexOf(x.cat)>=0}).map(function(x){return {cat:x.cat,texto:String(x.texto),on:true}});
      BRUI.msg=BRUI.props.length?"":"Não encontrei nada novo para guardar nesse texto.";
    }catch(err){BRUI.msg=crErr(err)||"Não consegui ler agora."}
    BRUI.busy="";render();
  }
});

});
