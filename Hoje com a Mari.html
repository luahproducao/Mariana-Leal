function pickDay(){var t=isoToday();for(var i=0;i<DAYS.length;i++){if(DAYS[i].date>=t)return DAYS[i].id}return DAYS[DAYS.length-1].id}

function daysUntil(iso){var a=new Date(isoToday()+"T00:00:00"),b=new Date(iso+"T00:00:00");return Math.round((b-a)/86400000)}
function trackItems(d){
  var out=[{id:d.id+"-f",label:"Feed: "+d.feed.title}];
  d.stories.forEach(function(s,i){out.push({id:d.id+"-s"+(i+1),label:"Story "+(i+1),core:s[2].indexOf("c")>=0,aud:s[0],tray:s[2].indexOf("t")>=0,text:s[1],n:i+1})});
  out.push({id:d.id+"-ma",label:"Melhores Amigos"});out.push({id:d.id+"-as",label:"Assinatura"});
  return out;
}
function stOf(id){return state.st[id]||"todo"}
function dayProgress(d){var its=trackItems(d),n=its.filter(function(x){return stOf(x.id)!=="todo"}).length;return {n:n,t:its.length}}
function isRest(d){return !!state.checks["rest-"+d.id]}
function getProd(id){return state.prod[id]||{s:"ideia",preco:""}}
function T(path,def){var p=path.split("."),o=state.tool;for(var i=0;i<p.length;i++){if(o==null)return def;o=o[p[i]]}return o==null?def:o}
function setT(path,v){var p=path.split("."),o=state.tool;for(var i=0;i<p.length-1;i++){if(o[p[i]]==null||typeof o[p[i]]!=="object")o[p[i]]={};o=o[p[i]]}o[p[p.length-1]]=v;saveTool()}
function parseNum(v){var s=String(v==null?"":v).trim();if(s.indexOf(",")>=0)s=s.replace(/\./g,"").replace(",",".");var n=parseFloat(s);return isNaN(n)?0:n}
function brl(n){return n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function pct(n){return n.toLocaleString("pt-BR",{maximumFractionDigits:1,minimumFractionDigits:1})+"%"}
function copyText(text,btn){
  var done=function(m){if(btn)btn.textContent=m};
  var fallback=function(){var ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand("copy")}catch(_){}document.body.removeChild(ta);done(ok?"Copiado":"Não consegui copiar")};
  try{navigator.clipboard.writeText(text).then(function(){done("Copiado")},fallback)}catch(_){fallback()}
}

  function f(key,label,def,hint){return '<label>'+label+'<input type="text" inputmode="decimal" data-tool="calc.'+key+'" value="'+esc(T("calc."+key,def))+'">'+(hint?'<span class="note">'+hint+'</span>':'')+'</label>'}
  return '<div class="card"><h3>Seus números</h3><div class="fields">'
   +f("custo","Custo da peça (R$)","40")+f("frete","Frete da compra (R$)","5")+f("tax","Taxas sobre a venda (%)","6","Cartão, plataforma, etc.")+f("mar","Margem que você quer (%)","30","Parte do preço que sobra")+f("atual","Preço atual (R$)","90","Opcional")
   +'</div><p class="note">Os valores iniciais são um exemplo fictício. Troque pelos seus.</p></div><div id="calc-out"></div>';

function updateCalc(){
  var o=$("#calc-out");if(!o)return;
  var custo=parseNum(T("calc.custo","40")),frete=parseNum(T("calc.frete","5")),tax=parseNum(T("calc.tax","6")),mar=parseNum(T("calc.mar","30")),atual=parseNum(T("calc.atual","90"));
  var den=1-tax/100-mar/100;
  if(den<=0.05){o.innerHTML='<div class="out bad"><b>Essa conta não fecha</b><p>Taxas mais margem passam de 95% do preço. Reduza a margem ou veja se as taxas estão certas.</p></div>';return}
  var minimo=(custo+frete)/den,lucro=minimo*mar/100;
  var h='<div class="out"><span class="note">Preço mínimo</span><span class="big">'+brl(minimo)+'</span><span>Sobram '+brl(lucro)+' por peça, com margem de '+pct(mar)+'.</span></div>';
  if(atual>0){
    if(atual<minimo)h+='<div class="out bad"><b>O preço atual está abaixo do mínimo</b><p>Com '+brl(atual)+' você não atinge a margem desejada. Sem desconto, já falta '+brl(minimo-atual)+'.</p></div>';
    else h+='<div class="out"><span class="note">Desconto máximo sobre '+brl(atual)+'</span><span class="big">'+pct((1-minimo/atual)*100)+'</span></div>';
    h+='<div class="card"><h3>Simulação de desconto</h3><div class="scroll"><table><thead><tr><th>Desconto</th><th>Preço</th><th>Margem</th><th></th></tr></thead><tbody>';
    [10,20,30,40].forEach(function(d){
      var pr=atual*(1-d/100),m=((pr*(1-tax/100))-custo-frete)/pr*100;
      var ok=m>=mar,neg=m<0;
      h+='<tr><td>'+d+'%</td><td>'+brl(pr)+'</td><td>'+pct(m)+'</td><td class="'+(ok?'good':'badc')+'">'+(ok?'Dentro':(neg?'Prejuízo':'Abaixo'))+'</td></tr>';
    });
    h+='</tbody></table></div></div>';
  }
  h+='<p class="note">Fórmula: (custo + frete) ÷ (1 − taxas − margem). Margem calculada sobre o preço de venda.</p>';
  o.innerHTML=h;
}

  var h='<div class="stack"><div><h2>Melhores Amigos e assinatura</h2><p class="sub">O feed atrai. Estes dois canais constroem confiança e geram a primeira compra.</p></div>'
   +'<div class="card"><h3>Papel de cada canal</h3><p><span class="tag m">Melhores Amigos</span> proximidade, bastidor real, votação e aviso antes de todo mundo.</p><p><span class="tag m">Assinatura</span> profundidade: ficha, exercício, aula curta e modelo para usar.</p><p class="note">Só anuncie o que estiver pronto. Não misture acesso à assinatura com acesso ao app antes de definir o que cada um inclui.</p></div>';
  h+='<div class="block"><h3>Melhores Amigos · série semanal</h3>';
  MAWEEKS.forEach(function(w){h+='<div class="item"><div class="row"><div class="txt"><b>Semana de '+w[0]+'</b></div></div>'+MASERIE.map(function(t,k){return chk('ma-'+w[1]+'-'+k,t)}).join('')+'</div>'});
  h+='</div><div class="block"><h3>Assinatura · entrega da semana</h3>'+ASSIN.map(function(a){return '<div class="card"><div><span class="date">'+a[0]+'</span></div><p>'+esc(a[1])+'</p></div>'}).join('')+'</div>';
  h+='<div class="block"><h3>Banco de ideias · Melhores Amigos</h3>'+IDEIAS_MA.map(function(a){return '<div class="card"><b>'+esc(a[0])+'</b><p class="note">'+esc(a[1])+'</p></div>'}).join('')+'</div>';
  h+='<div class="block"><h3>Banco de ideias · Assinatura</h3>'+IDEIAS_AS.map(function(a){return '<div class="card"><b>'+esc(a[0])+'</b><p class="note">'+esc(a[1])+'</p></div>'}).join('')+'</div>';
  h+='<p class="note">As entregas marcadas como proposta ainda precisam da decisão da Mari. As ideias que pedem um exemplo real só entram se ela puder contar.</p></div>';
  $("#view").innerHTML=h;
}

/* ---- Mais ---- */
function pillsMais(){return '<div class="pills">'+MORE.map(function(m){return '<button class="pill" data-more="'+m[0]+'" aria-pressed="'+(state.more===m[0])+'">'+m[1]+'</button>'}).join('')+'</div>'}
function renderMais(){
  var inner="";
  if(state.more==="prazos")inner=htmlPrazos();else if(state.more==="equipe")inner=htmlEquipe();else inner=htmlIdeias();
  $("#view").innerHTML='<div class="stack">'+pillsMais()+inner+'</div>';
}
function htmlPrazos(){
  var h='<div><h2>Prazos que não podem passar</h2><p class="sub">Só o que tem data e depende de você ou de uma marca.</p></div>';
  PRAZOS.forEach(function(x){
    var n=daysUntil(x.date),dd=x.date.slice(8,10)+"/"+x.date.slice(5,7);
    var c=n<0?"passou há "+(-n)+" dia"+(n===-1?"":"s"):(n===0?"é hoje":(n===1?"é amanhã":"faltam "+n+" dias"));
    h+='<div class="card"><div><span class="date">'+dd+'</span> <span class="tag'+(x.brand==="Loyall"?' l':'')+'">'+esc(x.brand)+'</span> <span class="count'+(n>=0&&n<=2?' hot':'')+'">'+c+'</span></div><h3>'+esc(x.t)+'</h3><p class="sub">'+esc(x.d)+'</p></div>';
  });
  var done=APPMS.filter(function(m){return state.checks[m[0]]}).length;
  h+='<div class="block"><h3>Lançamento do app Estoque Crescente · '+done+'/'+APPMS.length+'</h3><div class="item">'+APPMS.map(function(m){return chk(m[0],m[1])}).join("")+'</div></div>';
  return h;
}
function htmlEquipe(){
  var rows=DAYS.map(function(d){
    var its=trackItems(d),cnt={todo:0,rec:0,sent:0,edit:0,posted:0};
    its.forEach(function(x){cnt[stOf(x.id)]++});
    var r=state.results[d.id],n=state.notes[d.id];
    return '<tr><td>'+d.w+' '+d.n+(isRest(d)?'<br><span class="note">pausa</span>':'')+'</td><td>'+cnt.todo+' a gravar<br>'+(cnt.rec?'<b>'+cnt.rec+' gravado(s) esperando envio</b><br>':'')+(cnt.sent?cnt.sent+' com a Laila<br>':'')+(cnt.edit?cnt.edit+' editado(s)<br>':'')+cnt.posted+' postado(s)</td><td>'
      +(r?'Alcance '+esc(r.alc||"-")+', curtidas '+esc(r.cur||"-")+', respostas '+esc(r.res||"-")+', salvos '+esc(r.sal||"-")+(r.apr?'<br><span class="note">Aprendi: '+esc(r.apr)+'</span>':''):'<span class="note">sem resultado</span>')
      +(n?'<br><span class="note">Recado: '+esc(n)+'</span>':'')+'</td></tr>';
  }).join("");
  var done=APPMS.filter(function(m){return state.checks[m[0]]}).length;
  var venda=PRODS.filter(function(p){return getProd(p.id).s==="venda"}).length,and=PRODS.filter(function(p){var s=getProd(p.id).s;return s==="roteiro"||s==="feito"}).length;
  return '<div><h2>Visão da equipe</h2><p class="sub">Onde cada entrega está, os resultados que a Mari registrou e os recados.</p></div>'
   +'<div class="scroll"><table><thead><tr><th>Dia</th><th>Entregas</th><th>Resultado e recado</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
   +'<div class="card"><h3>App Estoque Crescente</h3><p>'+done+' de '+APPMS.length+' marcos concluídos.</p></div>'
   +'<div class="card"><h3>Mini produtos</h3><p>'+venda+' à venda, '+and+' em andamento, de '+PRODS.length+'.</p></div>'
   +'<p class="note">Briefings confidenciais das marcas não aparecem aqui. Ficam no quadro interno.</p>';
}
function htmlIdeias(){
  var list=state.ideas.slice().sort(function(a,b){return (b.at||0)-(a.at||0)});
  return '<div><h2>Caixa de ideias</h2><p class="sub">Anote a trend ou o assunto na hora. A equipe transforma em roteiro depois.</p></div>'
   +'<textarea id="idea" placeholder="Ex.: trend do áudio X, mostrando a embalagem do pedido..." aria-label="Nova ideia"></textarea>'
   +'<div class="btns"><button class="btn" id="addidea">Guardar ideia</button></div>'
   +(list.length?list.map(function(i){return '<div class="card"><p>'+esc(i.text)+'</p><span class="note">'+new Date(i.at).toLocaleDateString("pt-BR")+'</span></div>'}).join(""):'<p class="note">Nenhuma ideia guardada ainda.</p>');
}
function render(){
  renderChrome();
  var t=state.tab;
  if(t==="hoje")renderHoje();else if(t==="gravar")renderGravar();else if(t==="produtos")renderProdutos();else if(t==="canais")renderCanais();else renderMais();
}

/* ============ CRIAR MATERIAL (usa o Claude dentro da página) ============ */
var S=null,D=null;
var TIPOS=[["ebook","eBook"],["checklist","Checklist"],["ficha","Ficha"],["exercicio","Exercício"]];
var RULES="Contexto: Mariana Leal (@mariana.leaal) é influenciadora e dona de uma loja de roupas. O público dela é formado por lojistas iniciantes, muitas sem CNPJ, com pouco conhecimento de gestão. Escreva em português do Brasil, com linguagem simples, direta e humana, sem jargão e sem travessões. REGRAS: não invente fatos, histórias, números, resultados, preços ou depoimentos da Mariana. Use apenas o que ela escreveu e respondeu. Quando faltar informação, escreva [PREENCHER: o que falta]. Exemplos com números só se estiverem claramente marcados como fictícios. Nunca prometa resultado de vendas.";
function crNew(){return {step:0,tipo:"ebook",ideia:"",publico:"",perguntas:[],respostas:[],outline:null,material:null,busy:"",err:""}}
function saveCr(){try{localStorage.setItem("hoje-cr",JSON.stringify(state.cr))}catch(e){}}
function tipoLabel(t){return (TIPOS.filter(function(x){return x[0]===t})[0]||[,"Material"])[1]}
function normMat(r,old){return {titulo:String(r.titulo||old.titulo),subtitulo:String(r.subtitulo||""),intro:String(r.intro||""),fechamento:String(r.fechamento||""),secoes:(r.secoes||old.secoes).map(function(x){return {titulo:String(x.titulo||""),corpo:String(x.corpo||""),itens:(x.itens||[]).map(String)}})}}
function crErr(e){
  var c=e&&e.code;
  if(c==="not_granted")return "Para criar com o Claude, permita o uso quando o aviso aparecer.";
  if(c==="rate_limited")return "Muitas tentativas seguidas. Espere um pouco e tente de novo.";
  if(c==="cancelled")return "";
  return "Não consegui gerar agora. Seus textos continuam salvos. Tente de novo em instantes.";
}
async function crRun(label,fn){
  state.cr.busy=label;state.cr.err="";saveCr();render();
  try{await fn()}catch(e){state.cr.err=crErr(e)}
  state.cr.busy="";saveCr();render();
}
function qa(){var c=state.cr;return c.perguntas.map(function(q,i){return "P: "+q+"\nR: "+(c.respostas[i]||"(sem resposta)")}).join("\n\n")}
function crAction(a,el){
  var c=state.cr;
  if(a==="ask"){
    if(!c.ideia.trim()){c.err="Escreva a ideia primeiro, do jeito que você falaria.";render();return}
    crRun("Pensando nas perguntas...",async function(){
      var r=await S.json(RULES+"\n\nTipo de material: "+tipoLabel(c.tipo)+"\nIdeia da Mari: "+c.ideia+"\nPara quem: "+(c.publico||"(não informado)")+"\n\nFaça 4 perguntas curtas e específicas que ajudem a amadurecer essa ideia: para quem é, qual problema resolve, qual resultado a pessoa terá e que exemplo real a Mari pode contar. Responda SOMENTE com JSON no formato {\"perguntas\":[\"...\",\"...\",\"...\",\"...\"]}.",{modelTier:"quick"});
      c.perguntas=(r&&r.perguntas||[]).slice(0,5).map(String);c.respostas=c.perguntas.map(function(){return ""});c.step=1;
    });return;
  }
  if(a==="outline"){
    crRun("Montando o esqueleto...",async function(){
      var forma={ebook:"um eBook curto com 5 a 8 seções; em itens, liste os tópicos de cada seção",checklist:"um checklist com 4 a 6 grupos; em itens, liste de 3 a 6 tarefas curtas no imperativo por grupo",ficha:"uma ficha para preencher; em itens, liste os campos de cada grupo",exercicio:"um exercício prático; em itens, liste os passos de cada etapa"}[c.tipo];
      var r=await S.json(RULES+"\n\nTipo: "+forma+".\nIdeia da Mari: "+c.ideia+"\nPara quem: "+(c.publico||"(não informado)")+"\n\nPerguntas e respostas:\n"+qa()+"\n\nCrie o esqueleto. Responda SOMENTE com JSON no formato {\"titulo\":\"\",\"subtitulo\":\"\",\"secoes\":[{\"titulo\":\"\",\"itens\":[\"\"]}]}.",{modelTier:"default"});
      c.outline={titulo:String(r.titulo||""),subtitulo:String(r.subtitulo||""),secoes:(r.secoes||[]).map(function(s){return {titulo:String(s.titulo||""),itens:(s.itens||[]).map(String)}})};c.step=2;
    });return;
  }
  if(a==="write"){
    crRun("Escrevendo o material...",async function(){
      var o=c.outline;
      var forma={ebook:"Para cada seção escreva \"corpo\" com 60 a 120 palavras, simples e prático. Pode deixar \"itens\" vazio ou usar como lista de apoio.",checklist:"Mantenha \"itens\" claros, curtos e no imperativo. \"corpo\" é no máximo uma frase de apoio.",ficha:"\"itens\" são os campos a preencher. \"corpo\" é uma frase de instrução.",exercicio:"\"itens\" são os passos. \"corpo\" explica o objetivo da etapa em 1 ou 2 frases."}[c.tipo];
      var r=await S.json(RULES+"\n\nTipo: "+tipoLabel(c.tipo)+".\nIdeia da Mari: "+c.ideia+"\nPara quem: "+(c.publico||"(não informado)")+"\n\nPerguntas e respostas:\n"+qa()+"\n\nEsqueleto aprovado:\n"+JSON.stringify(o)+"\n\n"+forma+" Escreva também \"intro\" (2 a 3 frases) e \"fechamento\" (1 a 2 frases). Responda SOMENTE com JSON no formato {\"titulo\":\"\",\"subtitulo\":\"\",\"intro\":\"\",\"secoes\":[{\"titulo\":\"\",\"corpo\":\"\",\"itens\":[\"\"]}],\"fechamento\":\"\"}.",{modelTier:"default"});
      c.material={titulo:String(r.titulo||o.titulo),subtitulo:String(r.subtitulo||o.subtitulo),intro:String(r.intro||""),fechamento:String(r.fechamento||""),secoes:(r.secoes||[]).map(function(s){return {titulo:String(s.titulo||""),corpo:String(s.corpo||""),itens:(s.itens||[]).map(String)}})};c.step=3;c.view="edit";c.undo=null;
    });return;
  }
  if(a==="ver"){c.view="ver";saveCr();render();return}
  if(a==="editar"){c.view="edit";saveCr();render();return}
  if(a==="maddsec"){c.material.secoes.push({titulo:"",corpo:"",itens:[]});saveCr();render();return}
  if(a.indexOf("mdel")===0){c.material.secoes.splice(parseInt(a.slice(4),10),1);saveCr();render();return}
  if(a==="undo"&&c.undo){if(c.undo.kind==="all")c.material=c.undo.data;else c.material.secoes[c.undo.i]=c.undo.data;c.undo=null;saveCr();render();return}
  if(a.indexOf("voz")===0){
    var voz=(state.voz||"").trim(),ins=(c.instr||"").trim();
    if(!voz&&!ins){c.err="Cole um texto seu em “Meu jeito de falar” ou escreva um ajuste, como “mais direto”.";render();return}
    var all=a==="voz-all",idx=all?-1:parseInt(a.slice(3),10);
    var guia="Jeito da Mari de escrever e falar (exemplos reais dela):\n"+(voz||"(não informado)")+"\nAjuste pedido: "+(ins||"(nenhum)")+"\n\nReescreva no jeito dela: mesma linguagem, ritmo e expressões dos exemplos. Mantenha todos os fatos e o sentido, não acrescente informação nova, mantenha os trechos [PREENCHER] e a mesma estrutura de campos. Não copie frases inteiras dos exemplos.";
    crRun(all?"Reescrevendo tudo no seu jeito...":"Reescrevendo o bloco...",async function(){
      if(all){
        var r=await S.json(RULES+"\n\n"+guia+"\n\nMaterial atual:\n"+JSON.stringify(c.material)+"\n\nResponda SOMENTE com JSON no mesmo formato {\"titulo\":\"\",\"subtitulo\":\"\",\"intro\":\"\",\"secoes\":[{\"titulo\":\"\",\"corpo\":\"\",\"itens\":[\"\"]}],\"fechamento\":\"\"}.",{modelTier:"default"});
        c.undo={kind:"all",data:JSON.parse(JSON.stringify(c.material))};
        c.material=normMat(r,c.material);
      }else{
        var sec=c.material.secoes[idx];
        var r2=await S.json(RULES+"\n\n"+guia+"\n\nBloco atual:\n"+JSON.stringify(sec)+"\n\nResponda SOMENTE com JSON no formato {\"titulo\":\"\",\"corpo\":\"\",\"itens\":[\"\"]}.",{modelTier:"default"});
        c.undo={kind:"sec",i:idx,data:JSON.parse(JSON.stringify(sec))};
        c.material.secoes[idx]={titulo:String(r2.titulo||sec.titulo),corpo:String(r2.corpo||""),itens:(r2.itens||[]).map(String)};
      }
    });return;
  }
  if(a==="back"){c.step=Math.max(0,c.step-1);c.err="";saveCr();render();return}
  if(a==="reset"){state.cr=crNew();saveCr();render();return}
  if(a==="addsec"){c.outline.secoes.push({titulo:"",itens:[]});saveCr();render();return}
  if(a.indexOf("delsec")===0){c.outline.secoes.splice(parseInt(a.slice(6),10),1);saveCr();render();return}
  if(a==="copy"){copyText(materialText(c.material),el);return}
  if(a==="pdf"){
    if(!D){el.textContent="Salvar não está disponível aqui";return}
    var doc=null;try{doc=makePdf(c.material,c.tipo)}catch(e){doc=null}
    if(!doc){el.textContent="PDF indisponível agora";return}
    D.save({filename:crName(c.material)+".pdf",data:doc.output("arraybuffer")}).then(function(){el.textContent="PDF salvo"},function(e){el.textContent=(e&&e.code==="declined")?"Salvar cancelado":"Não consegui salvar o PDF"});
    return;
  }
  if(a==="save"){
    var m=c.material,name=(m.titulo||"material").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"material";
    var doc='<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(m.titulo)+'</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"><style>body{margin:0;padding:16px;background:#F6F1F3}'+MAT_CSS+'</style></head><body>'+materialHtml(m,c.tipo)+'</body></html>';
    if(!D){el.textContent="Salvar não está disponível aqui";return}
    D.save({filename:name+".html",data:doc}).then(function(){el.textContent="Arquivo salvo"},function(e){el.textContent=(e&&e.code==="declined")?"Salvar cancelado":"Não consegui salvar"});
    return;
  }
}
var MAT_CSS=".mt{font-family:'DM Sans',system-ui,sans-serif;color:#1F1A20;max-width:720px;margin:0 auto;line-height:1.55}"
+".mt *{box-sizing:border-box}"
+".mt-cover{background:#15101A;color:#fff;border-radius:18px;padding:32px 22px 24px;display:flex;flex-direction:column;gap:16px;min-height:380px;justify-content:flex-end}"
+".mt-pill{align-self:flex-start;border:1.5px solid rgba(255,255,255,.85);border-radius:999px;padding:4px 14px;font:600 12px Montserrat,Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}"
+".mt-title{font:800 34px/1.05 Montserrat,'Arial Black',Arial,sans-serif;text-transform:uppercase;margin:0;overflow-wrap:anywhere}"
+".mt-sub{margin:0;color:#E8DCE3;font-size:16px}"
+".mt-tag{align-self:flex-start;background:#D22B1F;color:#fff;font:800 14px Montserrat,Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:8px 16px;border-radius:4px}"
+".mt-by{font-size:13px;color:#CDBFC8}"
+".mt-hl{background:#FFF0B8;border-radius:12px;padding:14px 16px;margin-top:14px;color:#2A2118}"
+".mt-page{background:#fff;border:1px solid #EADFE5;border-radius:16px;padding:20px;margin-top:14px;display:flex;flex-direction:column;gap:10px}"
+".mt-label{align-self:flex-start;background:#FBCFE0;color:#5A1631;border-radius:999px;padding:3px 12px;font:700 12px Montserrat,Arial,sans-serif;letter-spacing:.05em;text-transform:uppercase}"
+".mt-h{font:800 21px/1.15 Montserrat,Arial,sans-serif;text-transform:uppercase;margin:0;overflow-wrap:anywhere}"
+".mt-body{margin:0;white-space:pre-line}"
+".mt-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}"
+".mt-list li{display:flex;gap:10px;align-items:flex-start}"
+".mt-list li:before{content:'';flex:0 0 18px;height:18px;border:2px solid #D22B1F;border-radius:4px;margin-top:3px}";
function materialHtml(m,tipo){
  var h='<div class="mt"><div class="mt-cover"><span class="mt-pill">@mariana.leaal</span><h1 class="mt-title">'+esc(m.titulo)+'</h1>'+(m.subtitulo?'<p class="mt-sub">'+esc(m.subtitulo)+'</p>':'')+'<span class="mt-tag">'+esc(tipoLabel(tipo))+'</span><span class="mt-by">Estoque Crescente</span></div>';
  if(m.intro)h+='<div class="mt-hl">'+esc(m.intro)+'</div>';
  (m.secoes||[]).forEach(function(s,i){
    h+='<section class="mt-page"><span class="mt-label">'+(tipo==="ebook"?'Capítulo '+(i+1):(i+1)+' de '+m.secoes.length)+'</span><h2 class="mt-h">'+esc(s.titulo)+'</h2>'
     +(s.corpo?'<p class="mt-body">'+esc(s.corpo)+'</p>':'')
     +((s.itens&&s.itens.length)?'<ul class="mt-list">'+s.itens.map(function(t){return '<li><span>'+esc(t)+'</span></li>'}).join('')+'</ul>':'')+'</section>';
  });
  if(m.fechamento)h+='<div class="mt-hl">'+esc(m.fechamento)+'</div>';
  return h+'</div>';
}
function materialText(m){
  var t=m.titulo+"\n"+(m.subtitulo||"")+"\n\n"+(m.intro?m.intro+"\n\n":"");
  (m.secoes||[]).forEach(function(s,i){t+=(i+1)+". "+s.titulo+"\n"+(s.corpo?s.corpo+"\n":"")+(s.itens||[]).map(function(x){return "☐ "+x}).join("\n")+"\n\n"});
  return t+(m.fechamento||"");
}
function renderCriar(){
  var c=state.cr;
  var h='<div class="stack"><div class="btns"><button class="btn ghost small" data-pback="1">← Produtos</button></div>'
   +'<div><h2>Criar material</h2><p class="sub">Escreva a ideia, responda algumas perguntas e o material sai montado com a sua identidade.</p></div>';
  if(!S){
    h+='<div class="draft">Este recurso usa o Claude e só aparece quando o app é aberto dentro do Claude, com a sua permissão. Abra o link pelo Claude para criar materiais.</div></div>';
    $("#view").innerHTML=h;return;
  }
  h+='<div class="note">Passo '+(c.step+1)+' de 4</div>';
  if(c.err)h+='<div class="draft" style="background:var(--bad-soft);color:var(--bad)">'+esc(c.err)+'</div>';
  if(c.busy){h+='<div class="card"><h3>'+esc(c.busy)+'</h3><p class="sub">Pode levar de 10 a 60 segundos. Não feche esta tela.</p></div></div>';$("#view").innerHTML=h;return}
  if(c.step===0){
    h+='<div class="card"><div class="pills">'+TIPOS.map(function(t){return '<button class="pill" data-crtipo="'+t[0]+'" aria-pressed="'+(c.tipo===t[0])+'">'+t[1]+'</button>'}).join('')+'</div>'
     +'<label class="lab">Sua ideia, do jeito que você falaria<textarea data-cr="ideia" placeholder="Ex.: quero ensinar a lojista a conferir o estoque antes de comprar mais...">'+esc(c.ideia)+'</textarea></label>'
     +'<label class="lab">Para quem é (opcional)<input type="text" data-cr="publico" value="'+esc(c.publico)+'" placeholder="Ex.: lojista que está começando"></label>'
     +'<div class="btns"><button class="btn" data-crx="ask">Amadurecer a ideia</button></div></div>';
  }else if(c.step===1){
    h+='<div class="card"><h3>Responda o que souber</h3><p class="note">Respostas curtas bastam. O que ficar sem resposta vira lacuna marcada no material, sem inventar nada.</p>'
     +c.perguntas.map(function(q,i){return '<label class="lab"><b style="color:var(--ink)">'+esc(q)+'</b><textarea data-cr="r'+i+'">'+esc(c.respostas[i]||"")+'</textarea></label>'}).join('')

     +'<div class="btns"><button class="btn" data-crx="pdf">Salvar PDF</button><button class="btn ghost" data-crx="save">Salvar página (HTML)</button><button class="btn ghost" data-crx="copy">Copiar texto</button><button class="btn ghost" data-crx="editar">Voltar a editar</button><button class="btn ghost" data-crx="reset">Começar outro</button></div>';

/* ============ PDF dentro do app (texto vetorial, via jsPDF) ============ */
function pdfSafe(s){return String(s==null?"":s).replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/…/g,"...").replace(/[–—]/g,"-").replace(/[•·]/g,"-").replace(/ /g," ").replace(/[^\n\x20-\x7e¡-ÿ]/g,"")}
function crName(m){return (m.titulo||"material").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"material"}
function makePdf(m,tipo){
  var J=window.jspdf;if(!J||!J.jsPDF)return null;
  var doc=new J.jsPDF({unit:"mm",format:"a4"}),W=210,H=297,M=18,CW=W-2*M,y=0;
  function rgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
  function fill(h){var c=rgb(h);doc.setFillColor(c[0],c[1],c[2])}
  function line(h){var c=rgb(h);doc.setDrawColor(c[0],c[1],c[2])}
  function ink(h){var c=rgb(h);doc.setTextColor(c[0],c[1],c[2])}
  /* capa */
  fill("#15101A");doc.rect(0,0,W,H,"F");
  var y0=110;doc.setFont("helvetica","bold");doc.setFontSize(9);
  var pt="@MARIANA.LEAAL",pw=doc.getTextWidth(pt)+10;
  line("#FFFFFF");doc.setLineWidth(0.4);doc.roundedRect(M,y0,pw,8,4,4,"S");ink("#FFFFFF");doc.text(pt,M+5,y0+5.3);
  doc.setFontSize(32);var tl=doc.splitTextToSize(pdfSafe(m.titulo).toUpperCase(),CW);y=y0+24;
  doc.text(tl,M,y);y+=tl.length*13;
  doc.setFont("helvetica","normal");doc.setFontSize(13);ink("#E8DCE3");
  var sl=doc.splitTextToSize(pdfSafe(m.subtitulo),CW);doc.text(sl,M,y+2);y+=sl.length*6+12;
  var tag=pdfSafe(tipoLabel(tipo)).toUpperCase();doc.setFont("helvetica","bold");doc.setFontSize(11);
  var tw=doc.getTextWidth(tag)+12;fill("#D22B1F");doc.rect(M,y,tw,10,"F");ink("#FFFFFF");doc.text(tag,M+6,y+6.7);
  y+=20;doc.setFont("helvetica","normal");doc.setFontSize(9);ink("#CDBFC8");doc.text("Estoque Crescente",M,y);
  /* páginas de conteúdo */
  function newPage(){doc.addPage();fill("#FBF7F9");doc.rect(0,0,W,H,"F");y=M+4}
  function need(h){if(y+h>H-M-6)newPage()}
  function para(text,size,font,col,lh){
    doc.setFont("helvetica",font);doc.setFontSize(size);ink(col);
    var ls=doc.splitTextToSize(pdfSafe(text),CW),step=size*0.3528*lh;
    ls.forEach(function(l){need(step);doc.text(l,M,y+size*0.3528);y+=step});
  }
  function box(text,bg,fg){
    doc.setFont("helvetica","normal");doc.setFontSize(11);
    var ls=doc.splitTextToSize(pdfSafe(text),CW-12),h=ls.length*5.6+10;need(h+4);
    fill(bg);doc.roundedRect(M,y,CW,h,3,3,"F");ink(fg);
    ls.forEach(function(l,i){doc.text(l,M+6,y+7+i*5.6)});y+=h+7;
  }
  newPage();
  if(m.intro)box(m.intro,"#FFF0B8","#2A2118");
  var secs=m.secoes||[];
  secs.forEach(function(s,i){
    need(34);
    var lab=tipo==="ebook"?"CAPÍTULO "+(i+1):(i+1)+" DE "+secs.length;
    doc.setFont("helvetica","bold");doc.setFontSize(8);
    var lw=doc.getTextWidth(lab)+8;fill("#FBCFE0");doc.roundedRect(M,y,lw,6,3,3,"F");ink("#5A1631");doc.text(lab,M+4,y+4.2);y+=10;
    para((s.titulo||"").toUpperCase(),15,"bold","#1F1A20",1.2);y+=2;
    if(s.corpo){para(s.corpo,10.5,"normal","#1F1A20",1.5);y+=2}
    (s.itens||[]).forEach(function(t){
      doc.setFont("helvetica","normal");doc.setFontSize(10.5);
      var ls=doc.splitTextToSize(pdfSafe(t),CW-9),h=ls.length*5.4;need(h+2);
      line("#D22B1F");doc.setLineWidth(0.5);doc.rect(M,y+0.6,3.6,3.6,"S");ink("#1F1A20");
      ls.forEach(function(l,k){doc.text(l,M+8,y+3.8+k*5.4)});y+=h+2.6;
    });
    y+=7;
  });
  if(m.fechamento)box(m.fechamento,"#FFF0B8","#2A2118");
  var n=doc.getNumberOfPages();
  for(var p=2;p<=n;p++){doc.setPage(p);doc.setFont("helvetica","normal");doc.setFontSize(8);ink("#8A7D86");doc.text("@mariana.leaal  ·  Estoque Crescente",M,H-10);doc.text(String(p-1),W-M,H-10,{align:"right"})}
  return doc;
}

/* ============ EVENTOS ============ */
function avisoTexto(d){
  var its=trackItems(d).filter(function(x){return x.n&&stOf(x.id)==="rec"});
  var nums=its.map(function(x){return x.n});
  var t="Oi Laila! "+(nums.length?"Gravei os stories "+nums.join(", ")+" de "+d.title+".":"Ainda não gravei os stories de "+d.title+".");
  var fs=stOf(d.id+"-f");if(fs==="rec")t+=" O vídeo do feed também está gravado.";
  if(state.notes[d.id])t+="\nRecado: "+state.notes[d.id];
  return t+"\nPode puxar os vídeos quando quiser.";
}
document.addEventListener("click",function(e){
  var el=e.target;
  var t=el.closest("[data-tab]");if(t){state.tab=t.dataset.tab;if(state.tab!=="produtos")state.pOpen=null;render();window.scrollTo(0,0);return}
  var dy=el.closest("[data-day]");if(dy){state.sel=dy.dataset.day;state.rec=0;render();return}
  var rd=el.closest("[data-recdone]");if(rd){var id=rd.dataset.recdone;if(stOf(id)==="todo"){state.st[id]="rec";dbSet("st",id,{s:"rec",at:Date.now()})}state.rec++;render();return}
  var rn=el.closest("[data-recnav]");if(rn){state.rec+=parseInt(rn.dataset.recnav,10);render();return}
  var rs=el.closest("[data-rest]");if(rs){var k="rest-"+state.sel,on=rs.dataset.rest==="1";state.checks[k]=on;dbSet("checks",k,{done:on,at:Date.now()});render();return}
  var cl=el.closest("[data-copylegenda]");if(cl){copyText(dayById(cl.dataset.copylegenda).feed.legenda,cl);return}
  var mo=el.closest("[data-more]");if(mo){state.more=mo.dataset.more;render();return}
  var po=el.closest("[data-popen]");if(po){state.pOpen=po.dataset.popen;state.chap=0;render();window.scrollTo(0,0);return}
  if(el.closest("[data-pback]")){state.pOpen=null;render();return}
  var ch=el.closest("[data-chap]");if(ch){state.chap=Math.max(0,Math.min(EBOOK.length-1,state.chap+parseInt(ch.dataset.chap,10)));render();return}
  var cg=el.closest("[data-chapgo]");if(cg){state.chap=parseInt(cg.dataset.chapgo,10);render();return}
  var la=el.closest("[data-ladd]");if(la){var key=la.dataset.ladd,tx=$("#l-"+key+"-t").value.trim(),ju=$("#l-"+key+"-j").value.trim();if(!tx)return;var arr=T("listas."+key,[]).slice();arr.push({t:tx,j:ju});setT("listas."+key,arr);render();return}
  var ld=el.closest("[data-ldel]");if(ld){var pr=ld.dataset.ldel.split(":"),a2=T("listas."+pr[0],[]).slice();a2.splice(parseInt(pr[1],10),1);setT("listas."+pr[0],a2);render();return}
  var cx=el.closest("[data-crx]");if(cx){crAction(cx.dataset.crx,cx);return}
  var ct=el.closest("[data-crtipo]");if(ct){state.cr.tipo=ct.dataset.crtipo;saveCr();render();return}
  if(el.id==="avisar"){copyText(avisoTexto(dayById(state.sel)),el);return}
  if(el.id==="copyficha"){copyText(fichaText(),el);return}
  if(el.id==="savenote"){var v=$("#note").value;state.notes[state.sel]=v;dbSet("notes",state.sel,{text:v,at:Date.now()},"Recado salvo");render();return}
  if(el.id==="saveres"){var o={alc:$("#r-alc").value,cur:$("#r-cur").value,res:$("#r-res").value,sal:$("#r-sal").value,apr:$("#r-apr").value,at:Date.now()};state.results[state.sel]=o;dbSet("results",state.sel,o,"Resultado salvo");render();return}
  if(el.id==="addidea"){var tx2=$("#idea").value.trim();if(!tx2)return;var id2="i"+Date.now(),o2={text:tx2,at:Date.now()};state.ideas.push({id:id2,text:tx2,at:o2.at});dbSet("ideas",id2,o2,"Ideia guardada");render();return}
});
document.addEventListener("input",function(e){
  var el=e.target;
  if(el.dataset&&el.dataset.cr){var k=el.dataset.cr,c=state.cr,v=el.value;
    if(k==="voz"){state.voz=v;try{localStorage.setItem("hoje-voz",v)}catch(_){}return}
    if(k==="instr"){c.instr=v;saveCr();return}
    if(k.charAt(0)==="m"){var m=c.material;if(k==="mt")m.titulo=v;else if(k==="ms")m.subtitulo=v;else if(k==="mi")m.intro=v;else if(k==="mf")m.fechamento=v;else if(k.slice(0,3)==="mst")m.secoes[parseInt(k.slice(3),10)].titulo=v;else if(k.slice(0,3)==="msc")m.secoes[parseInt(k.slice(3),10)].corpo=v;else if(k.slice(0,3)==="msi")m.secoes[parseInt(k.slice(3),10)].itens=v.split("\n").filter(function(x){return x.trim()});saveCr();return}
    if(k==="ideia")c.ideia=v;else if(k==="publico")c.publico=v;else if(k==="ot")c.outline.titulo=v;else if(k==="os")c.outline.subtitulo=v;
    else if(k.charAt(0)==="r")c.respostas[parseInt(k.slice(1),10)]=v;
    else if(k.slice(0,2)==="st")c.outline.secoes[parseInt(k.slice(2),10)].titulo=v;
    else if(k.slice(0,2)==="si")c.outline.secoes[parseInt(k.slice(2),10)].itens=v.split("\n").filter(function(x){return x.trim()});
    saveCr();return}
  if(!el.dataset||!el.dataset.tool)return;
  setT(el.dataset.tool,el.value);
  if(el.dataset.tool.indexOf("calc.")===0)updateCalc();
  if(el.dataset.tool.indexOf("ficha.")===0)updateFicha();
});
document.addEventListener("change",function(e){
  var el=e.target;if(!el.dataset)return;
  if(el.dataset.chk){var id=el.dataset.chk,on=el.checked;state.checks[id]=on;dbSet("checks",id,{done:on,at:Date.now()});render();return}
  if(el.dataset.st){var i2=el.dataset.st;state.st[i2]=el.value;dbSet("st",i2,{s:el.value,at:Date.now()});render();return}
  if(el.dataset.toolchk){setT(el.dataset.toolchk,el.checked);render();return}
  if(el.dataset.tool&&el.tagName==="SELECT"){setT(el.dataset.tool,el.value);updateFicha();return}
  if(el.dataset.pst){var pid=el.dataset.pst,g=getProd(pid);g={s:el.value,preco:g.preco};state.prod[pid]=g;dbSet("prod",pid,{s:g.s,preco:g.preco,at:Date.now()});render();return}
  if(el.dataset.price){var pid2=el.dataset.price,g2=getProd(pid2);g2={s:g2.s,preco:el.value};state.prod[pid2]=g2;dbSet("prod",pid2,{s:g2.s,preco:g2.preco,at:Date.now()});return}
  if(el.id==="core"){state.core=el.checked;state.rec=0;render()}
});

/* ============ INÍCIO ============ */
loadLocal();state.sel=pickDay();render();
function typing(){var a=document.activeElement;return a&&(a.tagName==="TEXTAREA"||(a.tagName==="INPUT"&&a.type==="text"))}
function listen(name,apply){
  C[name].onSnapshot(function(s){apply(s);saveLocal();if(!typing())render();setSync("Sincronizado com a equipe")},function(){});
}
(async function(){
  try{
    if(!window.claude||!window.claude.use)return;
    var db=await window.claude.use("db");if(!db)return;
    ["checks","st","notes","results","prod","ideas"].forEach(function(n){C[n]=db.collection(n)});
    listen("checks",function(s){var o={};s.docs.forEach(function(d){var x=d.data();if(x&&x.done)o[d.id]=true});state.checks=o});
    listen("st",function(s){var o={};s.docs.forEach(function(d){var x=d.data();if(x&&x.s)o[d.id]=x.s});state.st=o});
    listen("notes",function(s){var o={};s.docs.forEach(function(d){var x=d.data();if(x&&x.text)o[d.id]=x.text});state.notes=o});
    listen("results",function(s){var o={};s.docs.forEach(function(d){var x=d.data();if(x)o[d.id]=x});state.results=o});
    listen("prod",function(s){var o={};s.docs.forEach(function(d){var x=d.data();if(x&&x.s)o[d.id]={s:x.s,preco:x.preco||""}});state.prod=o});
    listen("ideas",function(s){var a=[];s.docs.forEach(function(d){var x=d.data();if(x&&x.text)a.push({id:d.id,text:x.text,at:x.at||0})});state.ideas=a});
  }catch(e){}
})();
(async function(){
  try{if(!window.claude||!window.claude.use)return;
    try{S=await window.claude.use("sample")}catch(e){}
    try{D=await window.claude.use("downloads")}catch(e){}
    if(state.tab==="produtos"&&!typing())render();
  }catch(e){}
})();
